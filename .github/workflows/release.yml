name: Release

on:
  push:
    branches:
      - main

# Two pushes in a row must not open or update the release pull request at the same time
concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      # Keeps a release pull request open that bumps package.json and adds the conventional
      # commits since the last release to CHANGELOG.md; merging it tags vX.Y.Z and creates the
      # GitHub release, and the push to main deploys the app with the new version as usual
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      # Looked up by the label release-please gives it, since the action's `pr` output is only set
      # when the pull request was created. Assigning someone already assigned is a no-op
      - name: Assign the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --label 'autorelease: pending' --json number --jq '.[].number' |
            xargs -I {} gh api "repos/$GITHUB_REPOSITORY/issues/{}/assignees" -f "assignees[]=$GITHUB_REPOSITORY_OWNER" --silent

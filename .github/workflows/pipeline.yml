name: Shrink-Me pipeline

on:
  push:
    branches:
      - main
  pull_request:

# A new push to a pull request supersedes its running checks; runs on main always finish so a deploy is never cut off
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, unit test and build
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    # Personal details for the legal notice and privacy policy, kept out of the source code
    # (Settings → Secrets and variables → Actions → Variables)
    env:
      VITE_LEGAL_NAME: ${{ vars.LEGAL_NAME }}
      VITE_LEGAL_STREET: ${{ vars.LEGAL_STREET }}
      VITE_LEGAL_POSTAL_CODE: ${{ vars.LEGAL_POSTAL_CODE }}
      VITE_LEGAL_CITY: ${{ vars.LEGAL_CITY }}
      VITE_LEGAL_COUNTRY: ${{ vars.LEGAL_COUNTRY }}
      VITE_LEGAL_EMAIL: ${{ vars.LEGAL_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Format (Oxfmt)
        run: pnpm format:check

      - name: Lint (Oxlint)
        run: pnpm lint:check

      - name: Unit tests (Vitest)
        run: pnpm test:unit --run

      - name: Check legal notice variables
        if: github.ref == 'refs/heads/main'
        run: |
          for name in VITE_LEGAL_NAME VITE_LEGAL_STREET VITE_LEGAL_POSTAL_CODE VITE_LEGAL_CITY VITE_LEGAL_COUNTRY VITE_LEGAL_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable ${name#VITE_} is not set, the legal notice would be incomplete"
              exit 1
            fi
          done

      - name: Build
        run: pnpm build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: E2E tests (${{ matrix.browser }})
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Browser builds depend on the Playwright version and, for WebKit, on the runner's OS image
      - name: Get Playwright version
        id: playwright
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # The cache only holds the browser binaries, the system libraries they link against still need installing
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      - name: E2E tests (Playwright)
        run: pnpm test:e2e --project=${{ matrix.browser }}

      # Also after a green run, so the traces of tests that only passed on a retry can be looked at
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy
    needs: [check, e2e]
    # Pull requests from forks get no secrets, so they cannot deploy a preview
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs the Wrangler version from the lockfile, which wrangler-action then reuses
      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Deploy counter Worker
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c workers/counter/wrangler.jsonc

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shrink-me --commit-dirty=true

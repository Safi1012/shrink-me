name: Shrink-Me pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Personal details for the legal notice and privacy policy, kept out of the source code
    # (Settings → Secrets and variables → Actions → Variables)
    env:
      VITE_LEGAL_NAME: ${{ vars.LEGAL_NAME }}
      VITE_LEGAL_STREET: ${{ vars.LEGAL_STREET }}
      VITE_LEGAL_POSTAL_CODE: ${{ vars.LEGAL_POSTAL_CODE }}
      VITE_LEGAL_CITY: ${{ vars.LEGAL_CITY }}
      VITE_LEGAL_COUNTRY: ${{ vars.LEGAL_COUNTRY }}
      VITE_LEGAL_EMAIL: ${{ vars.LEGAL_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format (Oxfmt)
        run: pnpm format:check

      - name: Lint (Oxlint)
        run: pnpm lint

      - name: Check legal notice variables
        if: github.ref == 'refs/heads/main'
        run: |
          for name in VITE_LEGAL_NAME VITE_LEGAL_STREET VITE_LEGAL_POSTAL_CODE VITE_LEGAL_CITY VITE_LEGAL_COUNTRY VITE_LEGAL_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable ${name#VITE_} is not set, the legal notice would be incomplete"
              exit 1
            fi
          done

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: E2E tests (Playwright)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Deploy counter Worker
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c workers/counter/wrangler.jsonc

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shrink-me --commit-dirty=true
